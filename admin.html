<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrador</title>
  <link rel="stylesheet" href="style.css" />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#22c55e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PM Online" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="favicon.ico?v=4" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo small">PM</div>
        <div>
          <h2>Admin</h2>
          <span>Panel principal</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="paciente"><span>👤</span> Paciente</button>
        <button class="nav-item" data-section="usuarios"><span>👥</span> Usuarios</button>
        <button class="nav-item" data-section="biblioteca"><span>📚</span> Biblioteca</button>
        <button class="nav-item" data-section="sesiones"><span>🏋️</span> Creación sesiones</button>
        <button class="nav-item" data-section="periodicidad"><span>📆</span> Periodicidad</button>
        <button class="nav-item" data-section="graficaPro"><span>🕸️</span> Gráfica PRO</button>

        <button class="nav-item" data-section="valoraciones"><span>📊</span> Valoraciones</button>
              <button class="nav-item" data-section="sistema"><span>⚙️</span> Sistema</button>
      </nav>
</aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <p class="eyebrow">P.M Preparador Físico Online</p>
          <h1 id="sectionTitle">Paciente</h1>
        </div>
        <div class="admin-user">
          <div class="admin-user-stack">
            <span id="adminName">Administrador</span>
            <button id="adminHeaderLogoutBtn" class="admin-header-logout-btn" type="button" onclick="localStorage.removeItem('currentUser'); window.location.href='index.html';">Cerrar sesión</button>
          </div>
          <div class="avatar">A</div>
        </div>
      </header>

      <section class="dashboard-grid">
        <article class="stat-card"><span>Pacientes activos</span><strong id="patientCounter">0</strong></article>
        <article class="stat-card"><span>Registros historial</span><strong id="historyCounter">0</strong></article>
        <article class="stat-card"><span>Archivos guardados</span><strong id="fileCounter">0</strong></article>
      </section>

      <section class="content-card" id="contentArea"></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-sync.js"></script>
  <script src="admin.js"></script>
  <script src="pwa-register.js"></script>
</body>
</html>
