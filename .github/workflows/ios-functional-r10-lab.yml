name: PPF iOS Functional R10 Lab

on:
  push:
    branches:
      - ppf-ios-functional-r10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-functional-lab:
    name: PPF iOS Functional Laboratory
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Verify experimental branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ppf-ios-functional-r10"
          echo "PPF_EXPERIMENTAL_BRANCH_OK"

      - name: Checkout experimental revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PPF_EXPERIMENTAL_CHECKOUT_OK"

      - name: Inspect Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: PPF-iOS-Health-Bridge/iOS/PPFiOSApp
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d PPFiOSApp.xcodeproj

      - name: Build experimental iOS application
        working-directory: PPF-iOS-Health-Bridge/iOS/PPFiOSApp
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project PPFiOSApp.xcodeproj \
            -scheme PPFiOSApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PPFDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="$RUNNER_TEMP/PPFDerivedData/Build/Products/Debug-iphonesimulator/PPFiOSApp.app"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/PPFiOSApp"

          echo "PPF_EXPERIMENTAL_BUILD_OK"

      - name: Verify bundled laboratory resources
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/PPFDerivedData/Build/Products/Debug-iphonesimulator/PPFiOSApp.app"
          WEB_PATH="$APP_PATH/PPFWeb"

          test -d "$WEB_PATH"

          for file in \
            index.html \
            ppf-lab.js \
            ppf-ios-lab.css \
            style.css \
            ppf-motion.css \
            ppf-smart-states.css \
            ppf-unified-feedback.css
          do
            test -f "$WEB_PATH/$file"
            echo "PPF_BUNDLED_RESOURCE_OK=$file"
          done

          echo "PPF_LAB_BUNDLE_OK"

      - name: Select exact iOS simulator
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_ID="$(
            xcrun simctl list devices available --json |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          matches = []

          for runtime, devices in data.get("devices", {}).items():
              if not runtime.endswith("iOS-18-5"):
                  continue

              for device in devices:
                  if (
                      device.get("name") == "iPhone 16 Pro"
                      and device.get("isAvailable") is True
                  ):
                      matches.append(device["udid"])

          if len(matches) != 1:
              sys.exit(
                  "PPF_INCONCLUSIVE: exact iPhone 16 Pro / iOS 18.5 unavailable"
              )

          print(matches[0])
          '
          )"

          test -n "$DEVICE_ID"
          echo "PPF_SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "PPF_EXPERIMENTAL_SIMULATOR_SELECTED"

      - name: Boot iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$PPF_SIMULATOR_UDID"
          xcrun simctl bootstatus "$PPF_SIMULATOR_UDID" -b
          echo "PPF_EXPERIMENTAL_SIMULATOR_BOOT_OK"

      - name: Install experimental application
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/PPFDerivedData/Build/Products/Debug-iphonesimulator/PPFiOSApp.app"

          xcrun simctl install "$PPF_SIMULATOR_UDID" "$APP_PATH"

          echo "PPF_EXPERIMENTAL_INSTALL_OK"

      - name: Launch experimental application
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/PPFLabEvidence"

          xcrun simctl launch \
            "$PPF_SIMULATOR_UDID" \
            org.ppf.preparadorfisico.dev \
            > "$RUNNER_TEMP/PPFLabEvidence/launch.txt"

          sleep 10

          echo "PPF_EXPERIMENTAL_LAUNCH_ATTEMPTED"

      - name: Collect experimental evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          EVIDENCE="$RUNNER_TEMP/PPFLabEvidence"
          mkdir -p "$EVIDENCE"

          xcodebuild -version \
            > "$EVIDENCE/xcode-version.txt" 2>&1 || true

          xcrun simctl list devices available \
            > "$EVIDENCE/devices.txt" 2>&1 || true

          if [ -n "${PPF_SIMULATOR_UDID:-}" ]; then
            xcrun simctl io \
              "$PPF_SIMULATOR_UDID" \
              screenshot "$EVIDENCE/ppf-ios-initial.png" || true
          fi

          echo "PPF_EXPERIMENTAL_EVIDENCE_COLLECTED"

      - name: Upload experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PPF-iOS-Functional-R10-Evidence
          path: ${{ runner.temp }}/PPFLabEvidence/
          if-no-files-found: warn
