name: PPF iOS Safe Simulator Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - ppf-ios-safe-build-r13

permissions:
  contents: read

jobs:
  ios-simulator-smoke:
    name: PPF iOS Simulator Smoke
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Verify isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ppf-ios-safe-build-r13"
          echo "PPF_ISOLATED_BRANCH_OK"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PPF_CHECKOUT_SHA=$(git rev-parse HEAD)"

      - name: Inspect Xcode environment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: PPF-iOS-Health-Bridge/iOS/PPFiOSApp
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d PPFiOSApp.xcodeproj

      - name: Build simulator application
        working-directory: PPF-iOS-Health-Bridge/iOS/PPFiOSApp
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project PPFiOSApp.xcodeproj \
            -scheme PPFiOSApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PPFDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="$RUNNER_TEMP/PPFDerivedData/Build/Products/Debug-iphonesimulator/PPFiOSApp.app"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/PPFiOSApp"

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"
          )

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP_PATH/Info.plist"
          )

          test "$BUNDLE_ID" = "org.ppf.preparadorfisico.dev"
          test "$EXECUTABLE" = "PPFiOSApp"

          echo "PPF_APP_IDENTITY_OK"

      - name: Select exact simulator
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_ID="$(
            xcrun simctl list devices available --json |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          matches = []

          for runtime, devices in data.get("devices", {}).items():
              if not runtime.endswith("iOS-18-5"):
                  continue

              for device in devices:
                  if (
                      device.get("name") == "iPhone 16 Pro"
                      and device.get("isAvailable") is True
                  ):
                      matches.append(device["udid"])

          if len(matches) != 1:
              sys.exit(
                  "PPF_INCONCLUSIVE: exact simulator "
                  "iPhone 16 Pro / iOS 18.5 unavailable"
              )

          print(matches[0])
          '
          )"

          test -n "$DEVICE_ID"

          echo "PPF_SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "PPF_SIMULATOR_SELECTED"

      - name: Boot simulator
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PPF_SIMULATOR_UDID" <<'PY'
          import subprocess
          import sys

          device = sys.argv[1]

          operations = [
              (["xcrun", "simctl", "boot", device], 60),
              (["xcrun", "simctl", "bootstatus", device, "-b"], 300),
          ]

          for command, limit in operations:
              try:
                  subprocess.run(
                      command,
                      check=True,
                      timeout=limit,
                  )
              except subprocess.TimeoutExpired:
                  sys.exit("PPF_FAIL: simulator boot timeout")
              except subprocess.CalledProcessError as error:
                  sys.exit(
                      f"PPF_FAIL: simulator boot error "
                      f"{error.returncode}"
                  )

          print("PPF_SIMULATOR_BOOT_OK")
          PY

      - name: Install application
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PPF_SIMULATOR_UDID" "$RUNNER_TEMP" <<'PY'
          import pathlib
          import subprocess
          import sys

          device = sys.argv[1]

          app = (
              pathlib.Path(sys.argv[2])
              / "PPFDerivedData"
              / "Build"
              / "Products"
              / "Debug-iphonesimulator"
              / "PPFiOSApp.app"
          )

          if not app.is_dir():
              sys.exit("PPF_FAIL: application missing")

          try:
              subprocess.run(
                  ["xcrun", "simctl", "install", device, str(app)],
                  check=True,
                  timeout=120,
              )
          except subprocess.TimeoutExpired:
              sys.exit("PPF_FAIL: installation timeout")
          except subprocess.CalledProcessError as error:
              sys.exit(
                  f"PPF_FAIL: installation error {error.returncode}"
              )

          print("PPF_SIMULATOR_INSTALL_OK")
          PY

      - name: Launch and observe application
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/PPFSmokeEvidence"

          python3 - "$PPF_SIMULATOR_UDID" "$RUNNER_TEMP/PPFSmokeEvidence" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys
          import time

          device = sys.argv[1]
          evidence = pathlib.Path(sys.argv[2])
          bundle = "org.ppf.preparadorfisico.dev"

          try:
              result = subprocess.run(
                  ["xcrun", "simctl", "launch", device, bundle],
                  capture_output=True,
                  text=True,
                  timeout=60,
              )
          except subprocess.TimeoutExpired:
              (evidence / "launch.txt").write_text(
                  "operation=simctl_launch\nstatus=timeout\ntimeout_seconds=60\n",
                  encoding="utf-8",
              )
              sys.exit("PPF_FAIL: launch timeout")

          (evidence / "launch.txt").write_text(
              f"exit_code={result.returncode}\n"
              f"stdout={result.stdout}\n"
              f"stderr={result.stderr}\n"
          )

          if result.returncode != 0:
              sys.exit("PPF_FAIL: application launch failed")

          match = re.search(
              rf"(?m)^{re.escape(bundle)}:\s*(\d+)\s*$",
              result.stdout,
          )

          if not match:
              sys.exit("PPF_INCONCLUSIVE: launch PID unavailable")

          pid = int(match.group(1))
          print(f"PPF_APP_PID={pid}", flush=True)

          time.sleep(10)

          try:
              check = subprocess.run(
                  [
                      "xcrun", "simctl", "spawn", device,
                      "/bin/ps", "-p", str(pid), "-o", "pid=",
                  ],
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
          except subprocess.TimeoutExpired:
              (evidence / "process-check.txt").write_text(
                  "operation=process_survival_check\nstatus=timeout\ntimeout_seconds=30\n",
                  encoding="utf-8",
              )
              sys.exit("PPF_INCONCLUSIVE: process check timeout")

          (evidence / "process-check.txt").write_text(
              f"expected_pid={pid}\n"
              f"exit_code={check.returncode}\n"
              f"stdout={check.stdout}\n"
              f"stderr={check.stderr}\n"
          )

          if check.returncode != 0:
              sys.exit(
                  "PPF_INCONCLUSIVE: process inspection "
                  "failed or process unavailable"
              )

          observed = check.stdout.strip().split()

          if observed != [str(pid)]:
              sys.exit(
                  "PPF_INCONCLUSIVE: process identity "
                  "not confirmed"
              )

          print("PPF_APP_SURVIVAL_10S_OK")
          PY

      - name: Collect simulator evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          EVIDENCE="$RUNNER_TEMP/PPFSmokeEvidence"
          mkdir -p "$EVIDENCE"

          {
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
          } > "$EVIDENCE/environment.txt" 2>&1 || true

          xcrun simctl list runtimes \
            > "$EVIDENCE/runtimes.txt" 2>&1 || true

          xcrun simctl list devices available \
            > "$EVIDENCE/devices.txt" 2>&1 || true

          if [ -n "${PPF_SIMULATOR_UDID:-}" ]; then
            python3 - "$PPF_SIMULATOR_UDID" "$EVIDENCE" <<'PY'
          import pathlib
          import subprocess
          import sys

          device = sys.argv[1]
          folder = pathlib.Path(sys.argv[2])

          try:
              subprocess.run(
                  [
                      "xcrun", "simctl", "io", device,
                      "screenshot",
                      str(folder / "ppf-ios-screen.png"),
                  ],
                  check=True,
                  timeout=45,
              )
              (folder / "screenshot-status.txt").write_text(
                  "operation=simulator_screenshot\nstatus=ok\n",
                  encoding="utf-8",
              )
              print("PPF_SCREENSHOT_OK")
          except Exception as error:
              (folder / "screenshot-status.txt").write_text(
                  f"operation=simulator_screenshot\nstatus=unavailable\nerror={error}\n",
                  encoding="utf-8",
              )
              print(f"PPF_SCREENSHOT_UNAVAILABLE: {error}")
          PY
          fi

          echo "PPF_EVIDENCE_COLLECTION_COMPLETE"

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PPF-iOS-Simulator-Smoke-Evidence
          path: ${{ runner.temp }}/PPFSmokeEvidence/
          if-no-files-found: warn
