name: iOS Health Bridge Build

on:
  workflow_dispatch:
  push:
    paths:
      - "PPF-iOS-Health-Bridge/**"
      - ".github/workflows/ios-health-bridge-build.yml"

jobs:
  build:
    name: Swift iOS / Apple SDK
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apple toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APPLE TOOLCHAIN ==="
          sw_vers
          uname -m
          xcodebuild -version
          xcrun swift --version

          IOS_SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "IOS_SDK_PATH=$IOS_SDK_PATH"
          echo "IOS_SDK_VERSION=$IOS_SDK_VERSION"

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios18.0 \
            -sdk "$IOS_SDK_PATH" \
            -print-target-info

      - name: Inspect Swift package
        working-directory: PPF-iOS-Health-Bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=== PACKAGE ==="
          cat Package.swift

          echo
          echo "=== SWIFT SOURCES ==="
          find Sources \
            -maxdepth 1 \
            -type f \
            -name '*.swift' \
            -print \
            | sort

      - name: Build iOS Core against iPhoneOS SDK
        working-directory: PPF-iOS-Health-Bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=== PPF iOS REAL BUILD ==="

          IOS_SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SWIFTC="$(xcrun --sdk iphoneos --find swiftc)"

          echo "SDK=$IOS_SDK_PATH"
          echo "SDK_VERSION=$IOS_SDK_VERSION"
          echo "SWIFTC=$SWIFTC"
          echo "TARGET=arm64-apple-ios18.0"

          mapfile -t SOURCES < <(
            find Sources \
              -maxdepth 1 \
              -type f \
              -name '*.swift' \
              ! -name '*.bak' \
              -print \
              | sort
          )

          echo "SOURCE_COUNT=${#SOURCES[@]}"

          if [ "${#SOURCES[@]}" -ne 15 ]; then
            echo "::error::Expected exactly 15 Swift source files, found ${#SOURCES[@]}"
            exit 1
          fi

          for source in "${SOURCES[@]}"; do
            echo "SOURCE=$source"
          done

          rm -rf .c4g-build
          mkdir -p .c4g-build

          "$SWIFTC" \
            -target arm64-apple-ios18.0 \
            -sdk "$IOS_SDK_PATH" \
            -parse-as-library \
            -module-name PPFIOSHealthBridge \
            -emit-module \
            -emit-module-path .c4g-build/PPFIOSHealthBridge.swiftmodule \
            "${SOURCES[@]}"

          echo
          echo "=== BUILD RESULT ==="
          ls -la .c4g-build
          echo "PPF_C4G_IOS_REAL_BUILD_OK"
