name: PPFiOSApp

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PPFiOSApp:
    type: application
    platform: iOS

    sources:
      - path: App

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ppf.preparadorfisico.dev
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  PPFiOSApp:
    build:
      targets:
        PPFiOSApp: all