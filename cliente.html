<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Cliente</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#22c55e" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="favicon.ico?v=4" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4" />
</head>
<body>
  <div class="client-layout">
    <aside class="client-sidebar">
      <div class="sidebar-brand">
        <div class="logo small">PF</div>
        <div>
          <h2>Cliente</h2>
          <span>Área personal</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="client-nav-item active" data-client-section="dashboard"><span>📊</span> Dashboard</button>
        <button class="client-nav-item" data-client-section="proxima"><span>🎯</span> Sesión próxima</button>
        <button class="client-nav-item" data-client-section="sesiones"><span>🏋️</span> Mis sesiones</button>
        <button class="client-nav-item" data-client-section="historial"><span>📊</span> Mis Valoraciones</button>
        <button class="client-nav-item" data-client-section="archivos"><span>🗂️</span> Mis archivos</button>
      </nav>

      <button id="clientLogoutBtn" class="logout">Cerrar sesión</button>
    </aside>

    <main class="client-main">
      <header class="admin-header">
        <div>
          <p class="eyebrow">Programa Preparador Físico</p>
          <h1 id="clientSectionTitle">Dashboard Cliente PRO</h1>
        </div>
        <div class="admin-user client-header-user">
          <div class="client-user-stack">
            <span id="clientHeaderName">Cliente</span>
            <button id="clientHeaderLogoutBtn" class="client-header-logout-btn" type="button">Cerrar sesión</button>
          </div>
          <div class="avatar" id="clientAvatar">C</div>
        </div>
      </header>

      <section class="content-card" id="clientContentArea"></section>
    </main>
  </div>

  <nav class="client-mobile-bottom-nav" aria-label="Navegación inferior cliente">
    <button class="client-mobile-tab active" type="button" data-client-section="dashboard">
      <span>🏠</span><small>Inicio</small>
    </button>
    <button class="client-mobile-tab" type="button" data-client-section="proxima">
      <span>🎯</span><small>Sesión</small>
    </button>
    <button class="client-mobile-tab" type="button" data-client-section="sesiones">
      <span>🏋️</span><small>Sesiones</small>
    </button>
    <button class="client-mobile-tab" type="button" data-client-section="historial">
      <span>📊</span><small>Valoraciones</small>
    </button>
    <button class="client-mobile-tab" type="button" data-client-section="archivos">
      <span>🗂️</span><small>Archivos</small>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-sync.js"></script>
  <script src="presence.js"></script>
  <script src="cliente.js"></script>
</body>
</html>
