<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Cliente</title>
  <link rel="stylesheet" href="style.css" />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#22c55e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PM Online" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="favicon.ico?v=4" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4" />
</head>
<body>
  <div class="client-layout">
    <aside class="client-sidebar">
      <div class="sidebar-brand">
        <div class="logo small">PM</div>
        <div>
          <h2>Cliente</h2>
          <span>Área personal</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="client-nav-item active" data-client-section="inicio"><span>📊</span> Dashboard</button>
        <button class="client-nav-item" data-client-section="proxima"><span>🎯</span> Sesión próxima</button>
        <button class="client-nav-item" data-client-section="sesiones"><span>🏋️</span> Mis sesiones</button>
        <button class="client-nav-item" data-client-section="historial"><span>📁</span> Mi historial</button>
        <button class="client-nav-item" data-client-section="archivos"><span>🗂️</span> Mis archivos</button>
      </nav>

      <button id="clientLogoutBtn" class="logout">Cerrar sesión</button>
    </aside>

    <main class="client-main">
      <header class="admin-header">
        <div>
          <p class="eyebrow">P.M. Preparador Físico</p>
          <h1 id="clientSectionTitle">Dashboard Cliente PRO</h1>
        </div>
        <div class="admin-user">
          <span id="clientHeaderName">Cliente</span>
          <div class="avatar" id="clientAvatar">C</div>
        </div>
      </header>

      <section class="content-card" id="clientContentArea"></section>
    </main>
  </div>

  <script src="cliente.js"></script>
  <script src="pwa-register.js"></script>
</body>
</html>
