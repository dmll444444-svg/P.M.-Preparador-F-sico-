<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P.M. Preparador Físico Online | Login</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#22c55e" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <div class="logo">PM</div>
        <h1>P.M. Preparador Físico Online</h1>
        <p>Acceso privado para clientes y administrador</p>
      </div>

      <form id="loginForm">
        <label>Usuario o nickname</label>
        <input type="text" id="username" placeholder="Ej: admin o cliente1" required />

        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Introduce tu contraseña" required />

        <button type="submit">Entrar</button>
        <p id="message"></p>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
