<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P.M. Preparador Físico Online| Login</title>
  <link rel="stylesheet" href="style.css?v=2026.07.20-cache-manager-v2" />

  <link rel="manifest" href="manifest.webmanifest?v=2026.07.20-cache-manager-v2" />
  <meta name="theme-color" content="#22c55e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PM Online" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="favicon.ico?v=4" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4" />
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <div class="logo">PM</div>
        <h1>P.M. Preparador Físico Online</h1>
        <p>Acceso privado para clientes y administrador</p>
      </div>

      <form id="loginForm" autocomplete="off">
        <label>Usuario o nickname</label>
        <input type="text" id="username" name="ppf_login_user_new" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')" placeholder="Ej: admin o cliente1" required />

        <label>Contraseña</label>
        <input type="password" id="password" name="ppf_login_pass_new" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')" placeholder="Introduce tu contraseña" required />

        <button type="submit">Entrar</button>
        <p id="message"></p>
      </form>
      <button class="pwa-install-btn" type="button" onclick="PM_PWA_INSTALL()">📲 Instalar app</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-sync.js"></script>
  <script src="presence.js"></script>
  <script src="app.js"></script>
  <script src="app-version.js?v=2026.07.20-cache-manager-v2"></script>
  <script src="ppf-cache-manager.js?v=2026.07.20-cache-manager-v2"></script>
  <script src="pwa-register.js?v=2026.07.20-cache-manager-v2"></script>
</body>
</html>
